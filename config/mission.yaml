# HS-2 mission configuration
#
# Every value here is an input you can change. Values that came from the
# supplied UNP budget spreadsheets are tagged  [budget].  Values the user
# stated directly are tagged  [given].  Everything else is an assumption and
# is tagged  [assumed]  with a short justification, because those are the
# numbers you should challenge first.

simulation:
  # Length of the propagation. 3 days is enough to average out the ground
  # station geometry (the ISS ground track repeats roughly every 3 days) while
  # staying fast. Bump to 30+ for beta-angle season effects.
  duration_days: 3.0
  # Integration / sampling step. 5 s resolves an 8 minute pass into ~100
  # samples and keeps the attitude-feasibility search affordable.
  time_step_s: 5.0
  epoch_utc: "2027-03-20T12:00:00"   # [assumed] near equinox -> mid-range beta

orbit:
  # ISS orbit. [given] target orbit.
  # Basilisk is initialised from these classical elements.
  altitude_km: 415.0          # [assumed] ISS operating band is 410-420 km
  eccentricity: 0.0007        # [assumed] near-circular, typical ISS value
  inclination_deg: 51.64      # ISS inclination
  raan_deg: 0.0               # [assumed] scan this to sweep beta angle
  arg_periapsis_deg: 0.0
  true_anomaly_deg: 0.0

environment:
  # Solar constant at 1 AU. The sim scales this by actual Sun distance.
  solar_constant_w_m2: 1361.0
  earth_albedo: 0.30          # [assumed] global mean; drives albedo loading
  earth_ir_w_m2: 237.0        # [assumed] global mean outgoing longwave
  # Centred-dipole magnetic field is used for magnetorquer authority.
  # 'wmm' is higher fidelity but needs the WMM coefficient file and a date
  # inside its validity window; 'dipole' is valid for any epoch.
  magnetic_model: dipole      # dipole | wmm

# ---------------------------------------------------------------------------
# Vizard scene settings. Purely cosmetic -- nothing here affects the analysis.
# ---------------------------------------------------------------------------
vizard:
  # Sensor cones are spacecraft-scale markers, not planet-scale volumes. The
  # stock Basilisk examples use 10 m; anything approaching orbit altitude fills
  # the screen and hides everything else.
  cone_height_m: 12.0
  # Ground stations: dim marker normally, bright and enlarged while the
  # spacecraft is above their elevation mask.
  station_idle_color: [255, 200, 0, 80]
  station_active_color: [40, 255, 130, 255]
  station_idle_marker_scale: 1.0
  station_active_marker_scale: 4.0

analysis:
  # Payload cadence candidates (experiments per second). The budget assumed
  # 0.2 Hz; the user asked for this to be a free parameter.
  payload_rate_hz_sweep: [0.02, 0.05, 0.1, 0.2, 0.5, 1.0]

  # Exclusion-angle trade. Both cameras' keep-out cones are swept to see what
  # relaxing (or tightening) them buys in science time.
  #
  # `lost_deg` moves the +z exclusion, applied to BOTH Sun and Earth: the
  # requirement quotes one angle covering both ("may not have earth or the sun
  # in their exclusion angle"), and the star tracker shares the face, so the
  # two move together. `found_deg` moves FOUND's Sun exclusion on +x.
  #
  # Both lists include the baseline (40, 70) so the sweep contains a direct
  # comparison point against the headline run.
  #
  # The LOST axis runs to 80 deg because that is where the geometry has to
  # break. Pointing FOUND at the limb fixes +x at the Earth angular radius
  # (~70 deg off nadir), and +z is perpendicular to it, so +z can reach at most
  # 90 + 70 = 160 deg from nadir. The Earth keep-out needs +z more than
  # (70 + lost_deg) from nadir, so at lost_deg = 90 there is no legal roll at
  # all and feasibility must hit zero. Sweeping to 80 brackets that cliff.
  exclusion_sweep:
    lost_deg: [20, 30, 40, 50, 60, 70, 80]
    found_deg: [50, 60, 70, 80, 90]
    # The pointing search is re-run for every grid point, so it uses a coarser
    # azimuth/roll grid than the headline run. 32 gives ~11 deg resolution,
    # which resolves feasibility fractions to well under a percent.
    search_resolution: 32
    payload_rate_hz: 0.2

    # Pointing-error buffer, in degrees, that every keep-out is enforced with.
    # This is an ADCS performance number rather than a payload requirement, but
    # it enters exactly the same inequality: a degree of pointing error costs
    # the same feasibility as a degree of extra keep-out. Sweeping it prices
    # ADCS work in the same currency as optical work.
    #
    # 0 is the unbuffered geometric answer -- not flyable, but it is the
    # reference the rest are measured against. The configured budget
    # (control + knowledge, see spacecraft.yaml) is included so the sweep
    # contains the as-designed point.
    #
    # It runs out to 21 deg, far past anything a real vehicle would fly, on
    # purpose: a buffer of m is the same inequality as moving both cones out by
    # m, so the knee must sit where the cone grid's knee sits. Going that far
    # turns "the buffer is cheap" from an assertion into a measurement of how
    # much slack there is before it stops being cheap.
    #
    # 11.1 and 21.1 are in the list for the cross-check rather than for their
    # own sake. A buffer of m enforces (40 + m, 70 + m); a grid cell (L, F) is
    # itself solved with the configured 1.1 deg buffer, so it enforces
    # (L + 1.1, F + 1.1). The two coincide when L = 38.9 + m -- which lands on
    # the grid's 50 and 60 deg rows at m = 11.1 and 21.1.
    pointing_margin_deg: [0.0, 0.5, 1.1, 2.0, 3.0, 5.0, 10.0, 11.1, 15.0,
                          20.0, 21.1]

    # Effective-half-angle decomposition.
    #
    #     effective half-angle = quoted exclusion + attitude uncertainty
    #
    # Both terms enter the same inequality, so feasibility depends only on the
    # sum. That means one sweep over the sum fills in the whole
    # quoted x uncertainty table, and `additivity_check` measures whether the
    # claim actually holds rather than assuming it.
    #
    # The ranges deliberately run past 90 deg. A keep-out half-angle beyond
    # 90 deg is a cone LARGER than a hemisphere: what is left for the boresight
    # is not "the sky minus a cap" but a cap of half-angle (180 - effective)
    # about the anti-Sun direction, shrinking to a point at 180 deg. FOUND's
    # 70 deg quoted exclusion crosses that line at 20 deg of uncertainty, and
    # the +z Earth constraint is already past it once the Earth angular radius
    # (~70 deg) is added in.
    effective_angle:
      found_deg: [50, 60, 70, 80, 90, 100, 110, 120, 130]
      lost_deg: [20, 30, 40, 50, 60, 70, 80, 90, 100]
      # Table axes. Quoted values are payload requirements; uncertainty values
      # are ADCS performance. 37 deg is FOUND's half field of view -- at or
      # above it the FOV shrink alone makes the mission infeasible, whatever
      # the keep-outs say.
      table_quoted_found_deg: [50, 60, 70, 80, 90]
      table_quoted_lost_deg: [20, 30, 40, 50, 60]
      table_uncertainty_deg: [0, 1.1, 5, 10, 20, 30, 40]
